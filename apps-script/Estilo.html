<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf6ee;
    --card: #ffffff;
    --ink: #2b2433;
    --muted: #7a7184;
    --line: #ece4da;
    --accent: #e0567a;
    --accent-ink: #ffffff;
    --ok: #2f9e6e;
    --warn-bg: #fff1f3;
    --warn: #b3264a;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .wrap.largo { max-width: 860px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 2px rgba(43,36,51,.06), 0 8px 24px rgba(43,36,51,.06);
    margin-bottom: 16px;
  }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .pequeno { font-size: 14px; margin: 6px 0 0; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; font-weight: 800; }
  h2 { font-size: 20px; margin: 0 0 8px; font-weight: 800; }
  .mensagem { white-space: pre-line; margin: 0 0 16px; }
  .convite {
    display: block; width: 100%; height: auto;
    border-radius: var(--radius); margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(43,36,51,.12);
  }
  label, .rotulo { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text], input:not([type]), textarea, input[type=password] {
    width: 100%; font: inherit; color: inherit;
    padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
    background: #fff;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .contadores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .contadores { grid-template-columns: 1fr; } }
  .stepper {
    display: flex; align-items: center; justify-content: space-between;
    border: 1.5px solid var(--line); border-radius: 12px; padding: 4px;
  }
  .stepper button {
    width: 44px; height: 44px; border: 0; border-radius: 10px;
    background: var(--bg); color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer;
  }
  .stepper output { font-size: 22px; font-weight: 800; min-width: 2ch; text-align: center; }
  .btn {
    display: inline-block; font: inherit; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    padding: 10px 16px; border-radius: 12px; text-decoration: none;
  }
  .btn.principal {
    width: 100%; margin-top: 20px; padding: 14px;
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 18px;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.perigo { color: var(--warn); }
  .aviso {
    background: var(--warn-bg); color: var(--warn);
    border-radius: 12px; padding: 10px 14px; margin: 16px 0 0;
  }
  .ok { text-align: center; padding: 8px 0; }
  .check {
    width: 56px; height: 56px; margin: 8px auto 12px; border-radius: 50%;
    background: var(--ok); color: #fff; font-size: 30px; line-height: 56px; font-weight: 800;
  }
  .ok .btn { margin-top: 8px; }
</style>
